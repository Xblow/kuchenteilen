services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuchenteilen
      POSTGRES_PASSWORD: kuchenteilen
      POSTGRES_DB: kuchenteilen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuchenteilen"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      DATABASE_URL: postgres://kuchenteilen:kuchenteilen@db:5432/kuchenteilen?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: 8080
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
